# One command starts everything: `docker compose up --build` (or `pnpm stack:up`).
# Web: http://localhost:8080   API: http://localhost:3000/api   API docs: http://localhost:3000/api/docs
# All credentials here are local demo values, not secrets.
name: construction-erp

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: erp
      POSTGRES_DB: erp_dev
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
      # Creates erp_test for `pnpm test:clean` on first start.
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U erp -d erp_dev']
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://erp:erp@db:5432/erp_dev?schema=public
      CORS_ORIGIN: http://localhost:8080,http://localhost:5173
      APP_VERSION: ${APP_VERSION:-0.0.0-dev}
    restart: unless-stopped
    ports:
      - '${API_PORT:-3000}:3000'
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/api/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    ports:
      - '${WEB_PORT:-8080}:80'
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

volumes:
  db-data:
